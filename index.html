<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Степени двойки — карточки</title>
<style>
  :root {
    --bg: #0f1117;
    --card-front: #1a1f2e;
    --card-back: #243b55;
    --text: #e8eaf0;
    --muted: #8a93a5;
    --accent: #4fc3f7;
    --border: #2a3040;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
  }
  h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 6px; }
  .hint { color: var(--muted); font-size: 0.9rem; margin-bottom: 28px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px;
    width: 100%;
    max-width: 860px;
  }
  .card {
    perspective: 900px;
    cursor: pointer;
    aspect-ratio: 3 / 4;
    -webkit-tap-highlight-color: transparent;
  }
  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: 1px solid var(--border);
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
  }
  .face-front { background: var(--card-front); }
  .face-back {
    background: var(--card-back);
    transform: rotateY(180deg);
  }
  .expr { font-size: 2rem; font-weight: 700; }
  .expr sup { font-size: 1.1rem; color: var(--accent); }
  .value { font-size: 2.2rem; font-weight: 700; }
  .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .face-back .label { color: #b8cfe8; }
  .controls { margin-top: 28px; display: flex; gap: 12px; }
  button {
    background: var(--card-front);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 0.9rem;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: var(--card-back); }
</style>
</head>
<body>
  <h1>Степени двойки</h1>
  <p class="hint">Нажми на карточку, чтобы перевернуть</p>
  <div class="grid" id="grid"></div>
  <div class="controls">
    <button id="flipAll">Перевернуть все</button>
    <button id="resetAll">Сбросить</button>
  </div>
<script>
(function() {
  'use strict';
  var grid = document.getElementById('grid');
  var cards = [];

  for (var n = 1; n <= 10; n++) {
    var card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<div class="card-inner">' +
        '<div class="face face-front">' +
          '<span class="label">степень</span>' +
          '<span class="expr">2<sup>' + n + '</sup></span>' +
        '</div>' +
        '<div class="face face-back">' +
          '<span class="label">значение</span>' +
          '<span class="value">' + Math.pow(2, n) + '</span>' +
        '</div>' +
      '</div>';
    card.addEventListener('click', (function(c) {
      return function() { c.classList.toggle('flipped'); };
    })(card));
    grid.appendChild(card);
    cards.push(card);
  }

  document.getElementById('flipAll').addEventListener('click', function() {
    cards.forEach(function(c) { c.classList.add('flipped'); });
  });
  document.getElementById('resetAll').addEventListener('click', function() {
    cards.forEach(function(c) { c.classList.remove('flipped'); });
  });
})();
</script>
</body>
</html>
