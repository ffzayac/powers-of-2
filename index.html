<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Степени двойки — карточки</title>
<style>
  :root {
    --bg: #0f1117;
    --card-front: #1a1f2e;
    --card-back: #243b55;
    --text: #e8eaf0;
    --muted: #8a93a5;
    --accent: #4fc3f7;
    --border: #2a3040;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  h1 { font-size: clamp(1.2rem, 4vw, 1.5rem); font-weight: 600; margin-bottom: 6px; }
  .hint { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 28px; }
  .tab {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 20px;
    min-height: 48px;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  .tab.active {
    background: var(--card-back);
    color: var(--text);
    border-color: var(--accent);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 16px;
    width: 100%;
    max-width: 860px;
  }
  .card {
    perspective: 900px;
    cursor: pointer;
    aspect-ratio: 3 / 4;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: 1px solid var(--border);
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
  }
  .face-front { background: var(--card-front); }
  .face-back {
    background: var(--card-back);
    transform: rotateY(180deg);
  }
  .expr { font-size: clamp(1.6rem, 6vw, 2rem); font-weight: 700; }
  .expr sup { font-size: 0.55em; color: var(--accent); }
  .value { font-size: clamp(1.7rem, 6.5vw, 2.2rem); font-weight: 700; }
  .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .face-back .label { color: #b8cfe8; }
  .controls { margin-top: 28px; display: flex; gap: 12px; }
  button {
    background: var(--card-front);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 18px;
    min-height: 48px;
    font-size: 0.9rem;
    cursor: pointer;
    transition: background 0.2s;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  @media (hover: hover) {
    button:hover { background: var(--card-back); }
  }

  /* Режим квиза */
  #quizView {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }
  #quizView.active { display: flex; }
  #gridView { width: 100%; max-width: 860px; }
  #gridView.hidden { display: none; }
  .quiz-card {
    width: min(320px, 80vw, max(150px, calc((100vh - 560px) * 0.75)));
    aspect-ratio: 3 / 4;
  }
  .quiz-card .expr { font-size: clamp(2.6rem, 11vw, 3.4rem); }
  .quiz-card .expr sup { font-size: 0.55em; }
  .quiz-card .value { font-size: clamp(3rem, 12vw, 3.8rem); }
  .quiz-card .label { font-size: 0.85rem; }
  .quiz-meta {
    margin-top: 20px;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .quiz-controls { margin-top: 16px; display: flex; gap: 12px; }
  .quiz-display {
    margin-top: 20px;
    width: min(320px, 100%);
    min-height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--card-front);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 1.4rem;
    font-weight: 600;
    letter-spacing: 0.05em;
  }
  .quiz-display.empty { color: var(--muted); font-size: 0.95rem; font-weight: 400; letter-spacing: 0; }
  .keypad {
    margin-top: 16px;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
    width: min(320px, 100%);
  }
  .key {
    background: var(--card-front);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    font-size: 1.15rem;
    font-family: inherit;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  @media (hover: hover) {
    .key:hover { background: var(--card-back); }
  }
  .key.accent { background: var(--card-back); border-color: var(--accent); }
  .keypad.locked .key { opacity: 0.5; pointer-events: none; }
  @media (max-height: 750px) {
    .tabs { margin-bottom: 12px; }
    .quiz-display { margin-top: 12px; min-height: 44px; }
    .keypad { margin-top: 12px; gap: 6px; }
    .key { min-height: 44px; }
    .quiz-meta { margin-top: 10px; }
    .quiz-controls { margin-top: 10px; }
    .quiz-controls button { min-height: 40px; padding: 8px 14px; }
  }
  @media (max-height: 600px) {
    body { padding-top: 14px; padding-bottom: 12px; }
    .tabs { margin-bottom: 8px; }
    .quiz-card { width: min(320px, 80vw, max(120px, calc((100vh - 480px) * 0.75))); }
    .quiz-display { margin-top: 10px; min-height: 40px; font-size: 1.2rem; }
    .keypad { margin-top: 10px; gap: 4px; }
    .key { min-height: 40px; font-size: 1.05rem; }
    .quiz-meta { margin-top: 8px; font-size: 0.8rem; }
    .quiz-controls { margin-top: 8px; }
    .quiz-controls button { min-height: 36px; padding: 6px 12px; font-size: 0.85rem; }
  }
  .face { transition: border-color 0.3s, box-shadow 0.3s; }
  body.quiz-mode .hint { display: none; }
  .quiz-card.correct .face {
    border-color: #4caf50;
    box-shadow: 0 0 18px rgba(76, 175, 80, 0.35);
  }
  .quiz-card.wrong .face {
    border-color: #e53935;
    box-shadow: 0 0 18px rgba(229, 57, 53, 0.35);
  }
</style>
</head>
<body>
  <h1>Степени двойки</h1>
  <div class="tabs">
    <button class="tab active" id="tabGrid">Все карточки</button>
    <button class="tab" id="tabQuiz">Квиз</button>
  </div>
  <p class="hint" id="hint">Нажми на карточку, чтобы перевернуть</p>

  <div id="gridView">
    <div class="grid" id="grid"></div>
    <div class="controls">
      <button id="flipAll">Перевернуть все</button>
      <button id="resetAll">Сбросить</button>
    </div>
  </div>

  <div id="quizView">
    <div class="card quiz-card" id="quizCard">
      <div class="card-inner">
        <div class="face face-front">
          <span class="label">степень</span>
          <span class="expr" id="quizExpr">2<sup>1</sup></span>
        </div>
        <div class="face face-back">
          <span class="label">значение</span>
          <span class="value" id="quizValue">2</span>
        </div>
      </div>
    </div>
    <div class="quiz-display empty" id="quizDisplay">Введи значение</div>
    <div class="keypad" id="keypad"></div>
    <div class="quiz-meta" id="quizMeta">Верно: 0 · Неверно: 0 · Точность: —</div>
    <div class="quiz-controls">
      <button id="quizResetStats">Сброс статистики</button>
      <button id="quizExit">Выход</button>
    </div>
  </div>

<script>
(function() {
  'use strict';
  var gridView = document.getElementById('gridView');
  var quizView = document.getElementById('quizView');
  var tabGrid = document.getElementById('tabGrid');
  var tabQuiz = document.getElementById('tabQuiz');
  var hint = document.getElementById('hint');
  var grid = document.getElementById('grid');
  var quizCard = document.getElementById('quizCard');
  var quizExpr = document.getElementById('quizExpr');
  var quizValue = document.getElementById('quizValue');
  var quizMeta = document.getElementById('quizMeta');

  /* ---- Режим «Все карточки» ---- */
  var cards = [];
  for (var n = 1; n <= 10; n++) {
    var card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<div class="card-inner">' +
        '<div class="face face-front">' +
          '<span class="label">степень</span>' +
          '<span class="expr">2<sup>' + n + '</sup></span>' +
        '</div>' +
        '<div class="face face-back">' +
          '<span class="label">значение</span>' +
          '<span class="value">' + Math.pow(2, n) + '</span>' +
        '</div>' +
      '</div>';
    card.addEventListener('click', (function(c) {
      return function() {
        c.classList.toggle('flipped');
        if (navigator.vibrate) navigator.vibrate(10);
      };
    })(card));
    grid.appendChild(card);
    cards.push(card);
  }

  document.getElementById('flipAll').addEventListener('click', function() {
    cards.forEach(function(c) { c.classList.add('flipped'); });
  });
  document.getElementById('resetAll').addEventListener('click', function() {
    cards.forEach(function(c) { c.classList.remove('flipped'); });
  });

  /* ---- Режим «Квиз» ---- */
  var quizStage = 'front';   // 'front' — ждём ответ, 'back' — показываем результат
  var quizCurrent = 0;
  var quizCorrect = 0;
  var quizWrong = 0;
  var quizTimer = null;
  var quizDisplay = document.getElementById('quizDisplay');
  var keypad = document.getElementById('keypad');
  var quizTyped = '';

  function randomN(notEqual) {
    var n;
    do {
      n = 1 + Math.floor(Math.random() * 10);
    } while (n === notEqual);
    return n;
  }

  function updateMeta() {
    var total = quizCorrect + quizWrong;
    var acc = total ? Math.round(quizCorrect / total * 100) + '%' : '—';
    quizMeta.textContent = 'Верно: ' + quizCorrect + ' · Неверно: ' + quizWrong + ' · Точность: ' + acc;
  }

  function applyCard(n) {
    quizExpr.innerHTML = '2<sup>' + n + '</sup>';
    quizValue.textContent = Math.pow(2, n);
  }

  function renderDisplay() {
    if (quizTyped) {
      quizDisplay.textContent = quizTyped;
      quizDisplay.classList.remove('empty');
    } else {
      quizDisplay.textContent = 'Введи значение';
      quizDisplay.classList.add('empty');
    }
  }

  function pressDigit(d) {
    if (quizStage !== 'front' || quizTyped.length >= 4) return;
    quizTyped += d;
    renderDisplay();
  }

  function pressBackspace() {
    if (quizStage !== 'front') return;
    quizTyped = quizTyped.slice(0, -1);
    renderDisplay();
  }

  function showQuizCard(n) {
    quizCurrent = n;
    quizStage = 'front';
    quizCard.classList.remove('correct', 'wrong');
    if (quizCard.classList.contains('flipped')) {
      // прячем старый ответ поворотом и меняем содержимое, когда оборот уже «на ребре»
      quizCard.classList.remove('flipped');
      setTimeout(function() { applyCard(n); }, 250);
    } else {
      applyCard(n);
    }
    quizTyped = '';
    renderDisplay();
    keypad.classList.remove('locked');
    updateMeta();
  }

  function answer() {
    if (quizStage !== 'front' || !/^\d+$/.test(quizTyped)) return;
    var ok = parseInt(quizTyped, 10) === Math.pow(2, quizCurrent);
    if (ok) { quizCorrect++; } else { quizWrong++; }
    if (navigator.vibrate) navigator.vibrate(ok ? 10 : [10, 50, 10]);
    quizStage = 'back';
    keypad.classList.add('locked');
    quizCard.classList.add(ok ? 'correct' : 'wrong');
    quizCard.classList.add('flipped');
    updateMeta();
    quizTimer = setTimeout(nextCard, 1200);
  }

  function nextCard() {
    if (quizTimer) { clearTimeout(quizTimer); quizTimer = null; }
    showQuizCard(randomN(quizCurrent));
  }

  // Собственная клавиатура: никакая системная клавиатура не открывается
  ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'back', '0', 'submit'].forEach(function(k) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'key' + (k === 'submit' ? ' accent' : '');
    b.textContent = k === 'back' ? '⌫' : (k === 'submit' ? 'Ответить' : k);
    if (k === 'back') b.setAttribute('aria-label', 'Стереть');
    b.addEventListener('click', function() {
      if (k === 'back') { pressBackspace(); }
      else if (k === 'submit') { answer(); }
      else {
        pressDigit(k);
        if (navigator.vibrate) navigator.vibrate(5);
      }
    });
    keypad.appendChild(b);
  });

  quizCard.addEventListener('click', function() {
    if (quizStage === 'back') nextCard();
  });
  // Физическая клавиатура на десктопе
  document.addEventListener('keydown', function(e) {
    if (!quizView.classList.contains('active')) return;
    if (e.key >= '0' && e.key <= '9') pressDigit(e.key);
    else if (e.key === 'Backspace') pressBackspace();
    else if (e.key === 'Enter') answer();
  });
  document.getElementById('quizResetStats').addEventListener('click', function() {
    quizCorrect = 0;
    quizWrong = 0;
    updateMeta();
  });
  document.getElementById('quizExit').addEventListener('click', function() {
    if (quizTimer) { clearTimeout(quizTimer); quizTimer = null; }
    setMode('grid');
  });

  /* ---- Переключение режимов ---- */
  function setMode(mode) {
    var isQuiz = mode === 'quiz';
    tabGrid.classList.toggle('active', !isQuiz);
    tabQuiz.classList.toggle('active', isQuiz);
    gridView.classList.toggle('hidden', isQuiz);
    quizView.classList.toggle('active', isQuiz);
    document.body.classList.toggle('quiz-mode', isQuiz);
    if (isQuiz) {
      hint.textContent = 'Введи значение степени и нажми «Ответить»';
      quizCorrect = 0;
      quizWrong = 0;
      showQuizCard(randomN(0));
    } else {
      hint.textContent = 'Нажми на карточку, чтобы перевернуть';
    }
  }

  tabGrid.addEventListener('click', function() { setMode('grid'); });
  tabQuiz.addEventListener('click', function() { setMode('quiz'); });
})();
</script>
</body>
</html>
